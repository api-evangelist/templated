meters:
- name: image_credits
  description: Credits consumed by image renders, billed 1 credit per image.
  unit: credits
  aggregation: sum
  dimensions:
  - account
  - template
- name: pdf_credits
  description: Credits consumed by PDF renders, billed 1 credit per page.
  unit: credits
  aggregation: sum
  dimensions:
  - account
  - template
- name: video_credits
  description: Credits consumed by video renders, computed from resolution, FPS, and duration.
  unit: credits
  aggregation: sum
  dimensions:
  - account
  - template
- name: plan_subscription
  description: Recurring monthly subscription charge for the selected plan tier.
  unit: months
  aggregation: sum
  dimensions:
  - account
  - plan
principles:
- name: Visibility
  description: Track render credit consumption per template and external_id against the monthly plan allotment.
- name: Allocation
  description: Tag renders with external_id to attribute credit usage to workloads, customers, or cost centers.
- name: Optimization
  description: Right-size the plan tier to expected monthly render volume; avoid redundant renders; batch and merge multi-page output to control credit burn.
- name: Accountability
  description: Review monthly credit usage against the plan allotment and assign owners per integration.
