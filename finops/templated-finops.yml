description: >-
  FinOps view of Templated spend. Templated bills via monthly subscription
  plans that bundle a fixed allotment of render credits. Credits are consumed
  per render: 1 credit per image, 1 credit per PDF page, and a computed credit
  cost for video based on resolution, frame rate, and duration. Cost is managed
  by selecting the right plan tier and minimizing wasted renders.
notes: >-
  Plan prices and credit allotments are subject to change; verify against the
  Templated pricing page during reconciliation.
sources:
- https://templated.io/pricing
- https://templated.io/docs/
