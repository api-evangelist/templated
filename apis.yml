description: Templated is an API for automated image, video, and PDF generation from
  reusable templates. Designers build templates in a drag-and-drop editor, then the
  REST API renders them at scale by overriding layer content, with synchronous and
  asynchronous rendering, batch and multi-page output, and webhook callbacks.
